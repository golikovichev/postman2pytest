name: Action smoke

# Proves the composite action still works, on every change to it.
#
# Runs against this checkout rather than the published release (install: skip,
# after an editable install), because an action that only ever exercises the
# last PyPI version cannot catch a break introduced in the same commit.

on:
  push:
    branches: [main]
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - core/**
      - templates/**
      - main.py
  pull_request:
    paths:
      - action.yml
      - .github/workflows/action-smoke.yml
      - core/**
      - templates/**
      - main.py

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install this checkout
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest requests

      - name: Convert and run the httpbin demo collection
        id: p2p
        uses: ./
        with:
          collection: data/httpbin_demo.json
          out: generated_tests/test_httpbin_smoke.py
          base-url: https://httpbin.org
          install: skip

      - name: Check the action reported what it generated
        env:
          TESTS_PATH: ${{ steps.p2p.outputs.tests-path }}
          TESTS_DIR: ${{ steps.p2p.outputs.tests-dir }}
          TEST_COUNT: ${{ steps.p2p.outputs.test-count }}
        run: |
          set -euo pipefail
          test -f "$TESTS_PATH"
          test -d "$TESTS_DIR"
          test "$TEST_COUNT" -gt 0
          echo "action reported ${TEST_COUNT} test(s)"

      # Without this the smoke can pass while exercising the published wheel:
      # `install: skip` is an exact string match, so a typo or a dropped line
      # would install PyPI over the editable install and the run would still be
      # green - the precise failure this workflow exists to catch.
      - name: Check it ran against this checkout, not a release
        run: |
          set -euo pipefail
          python - <<'PY'
          import core, os, sys
          where = os.path.realpath(core.__file__)
          root = os.path.realpath(os.environ["GITHUB_WORKSPACE"])
          print("core imported from", where)
          sys.exit(0 if where.startswith(root) else 1)
          PY
