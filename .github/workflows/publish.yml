name: Publish to PyPI

# Fires when a GitHub Release is published. Builds the sdist and wheel and
# uploads them to PyPI via Trusted Publishing (OIDC). No API token is stored:
# PyPI trusts this repository and workflow through a short-lived OpenID Connect
# identity, configured once on the PyPI project side under
# Settings -> Publishing -> Add a trusted publisher (workflow publish.yml,
# environment pypi).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/postman2pytest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          # Generate PEP 740 digital attestations (Sigstore) and upload them to
          # PyPI alongside the artifacts, so each published release is verifiably
          # signed and its provenance can be checked.
          attestations: true
